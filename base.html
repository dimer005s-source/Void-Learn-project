<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID LEARN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Твои шрифты и прочая мета-хрень -->
</head>
<body style="background-color: #fdfaf0;"> <!-- Твой Milk цвет -->
<div id="sidePane" class="side-panel">
    <div class="close-btn" onclick="toggleMenu()">&times;</div>

    <!-- Твой новый переключатель в углу -->
    <div class="theme-switcher-corner">
        <button onclick="setTheme('light')" title="Светлая"><i class="fas fa-sun"></i></button>
        <button onclick="setTheme('dark')" title="Темная"><i class="fas fa-moon"></i></button>
        <button onclick="setTheme('purple')" title="Фиолетовая"><i class="fas fa-ghost"></i></button> <!-- Фиолетовый призрак -->
    </div>

    <div class="menu-header">
        <div class="badge-top">VOID LEARN</div>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>
<script>
function startTest(lang) {
    let diff = document.getElementById('diff_' + lang).value;
    // Обязательно в кавычках, чтобы JS не поплыл
    location.href = `/start_test/${lang}/${diff}`;
}
function toggleMenu() { document.getElementById('sidePane').classList.toggle('active'); }
function toggleMenu() {
    let pane = document.getElementById('sidePane');
    let burger = document.querySelector('.burger-btn'); // Находим кнопку
    
    pane.classList.toggle('active');
    
    // Если меню активно — скрываем кнопку, если нет — показываем
    if (pane.classList.contains('active')) {
        burger.style.display = 'none';
    } else {
        burger.style.display = 'block';
    }
}
function setTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);
    localStorage.setItem('theme', themeName); // Сохраняем выбор
}

// При загрузке страницы проверяем, какая тема была выбрана ранее
const savedTheme = localStorage.getItem('theme') || 'light';
setTheme(savedTheme);

</script>
</body>
</html>
