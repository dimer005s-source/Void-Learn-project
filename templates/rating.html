<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Рейтинг лидеров | Void Learn</title>
</head>
<body>
    <div class="badge-top">РЕЙТИНГ</div>
    <div class="burger-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

    <div id="sidePane" class="side-panel">
        <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
        <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
        <a href="/lessons" class="nav-link">УРОКИ</a>
        <a href="/rating" class="nav-link active-page">РЕЙТИНГ</a>
    </div>

    <div class="auth-card" style="max-width: 600px; margin-top: 50px;">
        <h2 style="color: var(--mint);">ТОП УЧАСТНИКОВ</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-family: sans-serif;">
            <thead>
                <tr style="color: var(--mint); border-bottom: 2px solid var(--milk);">
                    <th style="padding: 10px;">МЕСТО</th>
                    <th style="padding: 10px; text-align: left;">ИГРОК</th>
                    <th style="padding: 10px;">КЛАСС</th>
                    <th style="padding: 10px;">БАЛЛЫ</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr style="border-bottom: 1px solid var(--milk);">
                    <td style="padding: 15px;">{{ loop.index }}</td>
                    <td style="padding: 15px; text-align: left;">{{ user.fio }}</td>
                    <td style="padding: 15px;">{{ user.grade }}</td>
                    <td style="padding: 15px; font-weight: bold; color: var(--mint);">
                        {{ (user.score_py or 0) + (user.score_cpp or 0) + (user.score_cs or 0) + (user.score_java or 0) }}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>function toggleMenu() { document.getElementById('sidePane').classList.toggle('active'); }</script>
</body>
</html>
