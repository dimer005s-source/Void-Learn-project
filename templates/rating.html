<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ range(1, 9999) | random }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>РЕЙТИНГ - Void Learn</title>
    <style>
        .rating-container { width: 95%; max-width: 700px; margin-top: 30px; }
        
        .user-row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-left: 5px solid transparent;
            transition: 0.3s;
        }

        /* Выделение ТОП-1 через переменную темы */
        .user-row.top-0 { 
            border-left-color: var(--gold); 
            background: rgba(255, 215, 0, 0.05); /* Легкий отсвет */
            transform: scale(1.02);
        }

        .rank {
            font-family: 'BlackAcute';
            font-size: 22px;
            color: var(--mint);
            width: 50px;
            text-align: center;
        }

        /* Сетка для данных юзера */
        .user-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr; /* Имя | Класс | Очки */
            flex-grow: 1;
            align-items: center;
            margin-left: 15px;
        }

        .username { 
            font-family: 'BlackAcute';
            font-size: 18px; 
            color: var(--text-main); 
        }

        .user-class { 
            font-family: 'DefaultFont'; 
            font-size: 14px; 
            color: var(--mint);
            text-align: center;
        }

        .score {
            font-family: 'BlackAcute';
            color: var(--text-main);
            font-size: 18px;
            text-align: right;
        }

        .score span { color: var(--mint); font-size: 12px; }
    </style>
</head>
<body>

    <div class="burger-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <div id="sidePane" class="side-panel">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <div class="theme-switcher-corner">
            <button onclick="setTheme('light')"><i class="fas fa-sun"></i></button>
            <button onclick="setTheme('dark')"><i class="fas fa-moon"></i></button>
            <button onclick="setTheme('purple')"><i class="fas fa-ghost"></i></button>
        </div>
        <div class="menu-header">
            <div class="badge-top">VOID LEARN</div>
        </div>
        <div class="nav-links-wrapper">
            <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
            <a href="/portfolios" class="nav-link">ГАЛЕРЕЯ</a>
            <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
            <a href="/lessons" class="nav-link">УРОКИ</a>
            <a href="/rating" class="nav-link active-page">РЕЙТИНГ</a>
        </div>
        <a href="/logout" class="exit-link">ВЫХОД</a>
    </div>

    <div class="auth-wrapper">
        <div class="badge-top">ТАБЛИЦА ЛИДЕРОВ</div>

        <div class="rating-container">
            <!-- Заголовки таблицы -->
            <div style="display: flex; padding: 0 20px; margin-bottom: 10px; opacity: 0.6; font-size: 10px; font-family: 'BlackAcute';">
                <div style="width: 50px; text-align: center;">МЕСТО</div>
                <div style="flex-grow: 1; margin-left: 65px; display: grid; grid-template-columns: 2fr 1fr 1fr;">
                    <div>ЛОГИН</div>
                    <div style="text-align: center;">КЛАСС</div>
                    <div style="text-align: right;">EXP</div>
                </div>
            </div>

            {% for user in users %}
            <div class="user-row {% if loop.index0 == 0 %}top-0{% endif %}">
                <div class="rank">#{{ loop.index }}</div>
                
                <div class="user-grid">
                    <div class="username">{{ user.username }}</div>
                    <div class="user-class">УРОВЕНЬ {{ user.level or 1 }}</div>
                    <div class="score">{{ user.exp or 0 }} <span>EXP</span></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleMenu() {
            const pane = document.getElementById('sidePane');
            const burger = document.querySelector('.burger-btn');
            pane.classList.toggle('active');
            if (pane.classList.contains('active')) {
                burger.style.opacity = '0'; burger.style.pointerEvents = 'none';
            } else {
                burger.style.opacity = '1'; burger.style.pointerEvents = 'all';
            }
        }
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
    </script>
</body>
</html>
