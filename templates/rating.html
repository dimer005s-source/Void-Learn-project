{% extends "base.html" %}
{% block content %}
<div class="profile-card">
    <h2 style="color: var(--mint); margin-bottom: 20px;">РЕЙТИНГ ПУСТОТЫ</h2>
    {% for user in users %}
    <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.05);">
        <span>{{ loop.index }}. {{ user.fio }} ({{ user.grade }})</span>
        <span style="color: var(--mint); font-weight: bold;">{{ user.score_py + user.score_cpp + user.score_cs + user.score_java }} XP</span>
    </div>
    {% endfor %}
</div>
{% endblock %}
