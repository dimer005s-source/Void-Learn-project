<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
    <title>РЕЙТИНГ - Void Learn</title>
</head>
<body>
<div id="sidePane" class="side-panel">
    <!-- Крестик -->
    <div class="close-btn" onclick="toggleMenu()">&times;</div>

    <!-- ВСЕ ССЫЛКИ КЛАДЁМ В ЭТУ ОБЁРТКУ -->
    <div class="nav-links-wrapper">
        <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
        <a href="/portfolios" class="nav-link">ГАЛЕРЕЯ</a>
        <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
        <a href="/lessons" class="nav-link">УРОКИ</a>
        <a href="/rating" class="nav-link">РЕЙТИНГ</a>
    </div>

    <!-- КНОПКЕ ВЫХОД ДАЁМ КЛАСС exit-link (БЕЗ style="...") -->
    <a href="/logout" class="exit-link">ВЫХОД</a>
</div>

    <!-- БУРГЕР -->
    <div class="burger-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <div class="auth-wrapper" style="margin-top: 40px; justify-content: flex-start;">
        <div class="badge-top">РЕЙТИНГ УЧАСТНИКОВ</div>

        <div class="profile-card" style="max-width: 800px; width: 95%; margin-top: 40px;">
            <h3 style="margin-bottom: 25px; letter-spacing: 2px;">ТОП УЧАСТНИКОВ ПЛАТФОРМЫ</h3>
            
            <div style="overflow-x: auto; width: 100%;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="color: var(--mint); text-transform: uppercase; font-size: 11px; border-bottom: 2px solid var(--milk);">
                            <th style="padding: 15px;">МЕСТО</th>
                            <th style="padding: 15px;">ИГРОК</th>
                            <th style="padding: 15px;">КЛАСС</th>
                            <th style="padding: 15px;">БАЛЛЫ</th>
                        </tr>
                    </thead>
                    <tbody style="font-family: 'DefaultFont', sans-serif;">
                        {% for user in users %}
                    <tr 
    {% if user.id == current_user.id %} 
        style="background: rgba(77, 182, 172, 0.1); border-left: 4px solid var(--mint);" 
    {% endif %} 
    style="border-bottom: 1px solid #f9f9f9; transition: 0.3s;"
>
                            <td style="padding: 15px; font-family: 'BlackAcute'; font-size: 18px;">{{ loop.index }}</td>
                            <td style="padding: 15px; text-transform: uppercase; font-weight: 600;">{{ user.fio }}</td>
                            <td style="padding: 15px; color: #777;">{{ user.grade }}</td>
                            <td style="padding: 15px; font-weight: bold; color: var(--mint); font-size: 18px;">
                                {{ (user.score_py or 0) + (user.score_cpp or 0) + (user.score_cs or 0) + (user.score_java or 0) }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div> 

    <script>
        function toggleMenu() {
            let pane = document.getElementById('sidePane');
            let burger = document.querySelector('.burger-btn');
            
            if (!pane) return;

            pane.classList.toggle('active');
            
            // Если бургер существует, меняем его видимость
            if (burger) {
                if (pane.classList.contains('active')) {
                    burger.style.opacity = '0';
                    burger.style.pointerEvents = 'none';
                } else {
                    burger.style.opacity = '1';
                    burger.style.pointerEvents = 'all';
                }
            }
        }
    </script>
</body>
</html>
