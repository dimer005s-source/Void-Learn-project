{% extends "base.html" %}
{% block title %}VOID LEARN - ГЛАВНАЯ{% endblock %}

{% block content %}
<div class="profile-card" style="text-align: center; max-width: 600px;">
    <h1 style="font-size: 60px; margin-bottom: 10px; color: var(--mint);">VOID LEARN</h1>
    <p style="color: var(--text-alt); margin-bottom: 30px; letter-spacing: 2px;">СИСТЕМА ОБУЧЕНИЯ НОВОГО ПОКОЛЕНИЯ</p>
    
    <div style="display: flex; flex-direction: column; gap: 15px;">
        <a href="/lessons" class="auth-btn" style="text-decoration: none;">НАЧАТЬ ОБУЧЕНИЕ</a>
        {% if not current_user.is_authenticated %}
            <div style="display: flex; gap: 10px;">
                <a href="/login" class="auth-btn" style="flex: 1; text-decoration: none; font-size: 14px;">ВХОД</a>
                <a href="/register" class="auth-btn" style="flex: 1; text-decoration: none; font-size: 14px;">РЕГИСТРАЦИЯ</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
