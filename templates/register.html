<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Регистрация | Void Learn</title>
</head>
<body>
    <div class="auth-wrapper">
        
        <div class="auth-card">
            <!-- ОСТАВЛЯЕМ ТОЛЬКО ОДНУ ПЛАШКУ -->
            <div class="badge-top">РЕГИСТРАЦИЯ</div>
            
            <h2 style="margin-top: 40px;">СОЗДАТЬ АККАУНТ</h2>

            <!-- Блок ошибок с анимацией -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert-box">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="text" name="fio" placeholder="ЛОГИН" required class="input-field">

                <input type="text" 
                       name="school_class" 
                       placeholder="КЛАСС (НАПРИМЕР: 9-А)" 
                       required 
                       pattern="^(?:[1-9]|1[0-1])-[a-zA-Zа-яА-Я]$"
                       class="input-field">

                <input type="email" name="email" placeholder="EMAIL" required class="input-field">

                <div class="password-wrapper">
                    <input type="password" name="password" id="password" placeholder="ПАРОЛЬ" required class="input-field">
                    <!-- Можно добавить кнопку глаза, если хочешь -->
                </div>

                <button type="submit" class="auth-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            </form>
            
            <a href="/login" style="text-decoration: none; color: var(--mint); font-size: 14px; margin-top: 25px; display: block; font-weight: bold;">
                УЖЕ ЕСТЬ АККАУНТ? ВОЙТИ
            </a>
        </div>
    </div>
</body>
</html>
