<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <title>ПРОФИЛЬ</title>
</head>
<body>
   <div id="sidePane" class="side-panel">
    <!-- Кнопка закрытия (если была) -->
    <div class="close-btn" onclick="toggleMenu()" style="align-self: flex-end; margin-right: 20px; font-size: 30px; cursor: pointer; color: #4db6ac;">&times;</div>

    <!-- Основные ссылки -->
    <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
    <a href="/portfolios" class="nav-link">ГАЛЕРЕЯ</a>
    <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
    <a href="/lessons" class="nav-link">УРОКИ</a>
    <a href="/rating" class="nav-link">РЕЙТИНГ</a>

    <!-- Распорка, которая вытолкнет Выход вниз -->
    <div style="flex-grow: 1;"></div>

    <!-- Кнопка Выход теперь внизу -->
    <a href="/logout" class="nav-link" style="color: #ff6b6b !important; border-top: 1px solid #eee; width: 100%; border-radius: 0; margin: 0; padding: 20px 25px;">ВЫХОД</a>
</div>

    <div class="burger-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

    <div class="auth-wrapper">
        <div class="badge-top">ЛИЧНЫЙ КАБИНЕТ</div>
        <div class="profile-card">
            <h3>{{ current_user.fio }}</h3>
            <p>{{ current_user.grade }} | {{ current_user.email }}</p>

            <button class="toggle-btn" onclick="togglePortfolio()" style="margin-top:20px;">
                ПОРТФОЛИО <span id="arrow">▼</span>
            </button>

            <div id="portfolio-content">
                <form action="/save_portfolio" method="POST">
                    <input type="text" name="title" placeholder="НАЗВАНИЕ" class="input-field" required>
                    <textarea name="description" placeholder="ОПИСАНИЕ" class="input-field" required></textarea>
                    <input type="text" name="google_link" placeholder="ССЫЛКА (DRIVE)" class="input-field" required>
                    <input type="text" name="img_link" placeholder="СКРИНШОТ (URL)" class="input-field">
                    
                    <div class="tags-grid">
                        <label class="tag-item"><input type="radio" name="lang_tag" value="#python" required> #PYTHON</label>
                        <label class="tag-item"><input type="radio" name="lang_tag" value="#cpp"> #C++</label>
                        <label class="tag-item"><input type="radio" name="type_tag" value="#game" required> #GAME</label>
                        <label class="tag-item"><input type="radio" name="type_tag" value="#site"> #SITE</label>
                    </div>
                    <button type="submit" class="auth-btn">ВЫЛОЖИТЬ</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidePane').classList.toggle('active'); }
        function togglePortfolio() {
            let content = document.getElementById('portfolio-content');
            let arrow = document.getElementById('arrow');
            if (content.style.display === "none" || content.style.display === "") {
                content.style.display = "block";
                arrow.innerText = "▲";
            } else {
                content.style.display = "none";
                arrow.innerText = "▼";
            }
        }
        function toggleMenu() {
    let pane = document.getElementById('sidePane');
    let burger = document.querySelector('.burger-btn'); // Находим кнопку
    
    pane.classList.toggle('active');
    
    // Если меню активно — скрываем кнопку, если нет — показываем
    if (pane.classList.contains('active')) {
        burger.style.display = 'none';
    } else {
        burger.style.display = 'block';
    }
}

    </script>
</body>
</html>
