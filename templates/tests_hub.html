{% extends "base.html" %}
{% block content %}
<div class="badge-top">ТЕСТ-ХАБ</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 500px; width: 90%;">
    {% for lang in ['PYTHON', 'C++', 'JAVA', 'WEB'] %}
    <a href="/test/{{ lang.lower() }}" class="profile-card" style="text-decoration: none; transition: 0.3s; transform: scale(1);" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <h3 style="color: var(--mint); margin: 0;">#{{ lang }}</h3>
        <p style="font-size: 10px; color: var(--text-alt); margin-top: 5px;">ПРОВЕРИТЬ ЗНАНИЯ</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
