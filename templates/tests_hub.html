{% extends "base.html" %}

{% block content %}
<div class="badge-top"></div>

<div class="tests-grid">
    {% set languages = [
        {'id': 'python', 'name': 'PYTHON'},
        {'id': 'cpp',    'name': 'C++'},
        {'id': 'java',   'name': 'JAVA'},
        {'id': 'web',    'name': 'WEB'}
    ] %}

    {% for lang in languages %}
    <a href="/test/{{ lang.id }}" class="profile-card">
        <h3>#{{ lang.name }}</h3>
        <p>ПРОВЕРИТЬ ЗНАНИЯ</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
