<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>ГАЛЕРЕЯ - Void Learn</title>
</head>
<body>

    <!-- БУРГЕР -->
    <div class="burger-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <!-- МЕНЮ -->
    <div id="sidePane" class="side-panel">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>

        <div class="theme-switcher-corner">
            <button onclick="setTheme('light')" title="Светлая"><i class="fas fa-sun"></i></button>
            <button onclick="setTheme('dark')" title="Темная"><i class="fas fa-moon"></i></button>
            <button onclick="setTheme('purple')" title="Фиолетовая"><i class="fas fa-ghost"></i></button>
        </div>

        <div class="menu-header">
            <div class="badge-top">VOID LEARN</div>
        </div>

        <div class="nav-links-wrapper">
            <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
            <a href="/portfolios" class="nav-link active-page">ГАЛЕРЕЯ</a>
            <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
            <a href="/lessons" class="nav-link">УРОКИ</a>
            <a href="/rating" class="nav-link">РЕЙТИНГ</a>
        </div>

        <a href="/logout" class="exit-link">ВЫХОД</a>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="auth-wrapper">
        <div class="badge-top">ГАЛЕРЕЯ ПРОЕКТОВ</div>
        
        <!-- Сетка проектов (тут твое наполнение галереи) -->
        <div class="portfolio-grid" style="width: 90%; max-width: 1200px; margin-top: 30px;">
            {% for p in portfolios %}
            <div class="profile-card" style="margin-bottom: 20px;">
                <h3>{{ p.title }}</h3>
                <p>{{ p.description }}</p>
                <div class="tags-grid">
                    <span class="tag-item">{{ p.lang_tag }}</span>
                    <span class="tag-item">{{ p.type_tag }}</span>
                </div>
                <a href="{{ p.google_link }}" target="_blank" class="auth-btn">ПОСМОТРЕТЬ</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleMenu() {
            const pane = document.getElementById('sidePane');
            const burger = document.querySelector('.burger-btn');
            pane.classList.toggle('active');
            if (burger) {
                burger.style.opacity = pane.classList.contains('active') ? '0' : '1';
                burger.style.pointerEvents = pane.classList.contains('active') ? 'none' : 'all';
            }
        }

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
    </script>
</body>
</html>
