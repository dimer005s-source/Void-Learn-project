<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Вход | Void Learn</title>
</head>
<body>
<div id="sidePane" class="side-panel">
    <div class="close-btn" onclick="toggleMenu()">&times;</div>

    <!-- Твой новый переключатель в углу -->
    <div class="theme-switcher-corner">
        <button onclick="setTheme('light')" title="Светлая"><i class="fas fa-sun"></i></button>
        <button onclick="setTheme('dark')" title="Темная"><i class="fas fa-moon"></i></button>
        <button onclick="setTheme('purple')" title="Фиолетовая"><i class="fas fa-ghost"></i></button> <!-- Фиолетовый призрак -->
    </div>

    <div class="menu-header">
        <div class="badge-top">VOID LEARN</div>
    </div>
<div class="auth-wrapper">
    <div class="badge-top">ВХОД</div>


<div class="auth-card">
    <h2 style="color: var(--mint);">ДОБРО ПОЖАЛОВАТЬ</h2>
    
    <form method="POST">
        <input type="email" name="email" class="input-field" placeholder="EMAIL" required>
        
        <div class="password-wrapper">
            <input type="password" name="password" id="passInput" class="input-field" placeholder="ПАРОЛЬ" required>
            <button type="button" class="eye-btn" onclick="togglePass()"><i id="eyeIcon" class="fa-regular fa-eye"></i></button>
        </div>

        <button type="submit" class="auth-btn">ВОЙТИ</button>
        
        <!-- ОШИБКА ТЕПЕРЬ ТУТ, ПОД КНОПКОЙ -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-box"> {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </form>

    <a href="/register" style="text-decoration: none; color: var(--mint); font-size: 14px; margin-top: 25px; display: block; font-weight: bold; text-transform: uppercase;">
    НЕТ АККАУНТА? ЗАРЕГИСТРИРОВАТЬСЯ
</a>
</div>

</div>

<script>
    function togglePass() {
    const passInput = document.getElementById('passInput');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passInput.type === 'password') {
        passInput.type = 'text';
        // Меняем на "закрытый глаз"
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passInput.type = 'password';
        // Меняем обратно на "открытый"
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}
function setTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);
    localStorage.setItem('theme', themeName); // Сохраняем выбор
}

// При загрузке страницы проверяем, какая тема была выбрана ранее
const savedTheme = localStorage.getItem('theme') || 'light';
setTheme(savedTheme);

</script>

</body>
</html>
