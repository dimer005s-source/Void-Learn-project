{% extends "base.html" %}

{% block content %}
<div class="badge-top">ТЕСТИРОВАНИЕ: {{ lang_name }}</div>

<div class="profile-card" style="width: 100%; max-width: 520px; margin: 0 auto;">
    <div id="quiz-container">
        <!-- Индикатор прогресса -->
        <div id="quiz-progress" style="font-size: 11px; color: var(--widget-label); letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase;">
            Вопрос <span id="current-q-num">1</span> из <span id="total-q-num">0</span>
        </div>

        <!-- Текст вопроса -->
        <h3 id="question-text" style="margin-top: 0; margin-bottom: 24px; line-height: 1.4; color: var(--text-main);">
            Загрузка вопроса...
        </h3>

        <!-- Контейнер для кнопок с ответами -->
        <div id="answers-list" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- Кнопки генерируются скриптом -->
        </div>
    </div>

    <!-- Блок результатов (изначально скрыт) -->
    <div id="result-container" style="display: none; text-align: center; padding: 10px 0;">
        <h2 style="color: var(--mint); margin-bottom: 10px;">ТЕСТ ЗАВЕРШЁН</h2>
        <p id="score-text" style="font-size: 16px; margin-bottom: 25px; color: var(--text-main);"></p>
        
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <button class="auth-btn" onclick="restartQuiz()">Пройти заново</button>
            <a href="/tests_hub" class="auth-btn">В тест-хаб</a>
        </div>
    </div>
</div>

<script>
    // Пример базы вопросов (в реальном проекте можно подгружать через fetch/API)
    const questions = [
        {
            question: "Какая функция используется для вывода данных в консоль?",
            options: ["print() / console.log()", "input() / scanf()", "read()", "writeLineOnly()"],
            correct: 0
        },
        {
            question: "Какой тип данных используется для хранения логических значений (true / false)?",
            options: ["String", "Integer", "Boolean", "Float"],
            correct: 2
        },
        {
            question: "Что произойдет при делении целого числа на ноль в большинстве языков?",
            options: ["Вернется 0", "Вернется Infinity", "Возникнет ошибка / Exception", "Программа пропустит строку"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const quizContainer = document.getElementById("quiz-container");
    const resultContainer = document.getElementById("result-container");
    const questionText = document.getElementById("question-text");
    const answersList = document.getElementById("answers-list");
    const currentQNum = document.getElementById("current-q-num");
    const totalQNum = document.getElementById("total-q-num");
    const scoreText = document.getElementById("score-text");

    function initQuiz() {
        totalQNum.textContent = questions.length;
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        currentQNum.textContent = currentQuestionIndex + 1;
        questionText.textContent = q.question;
        answersList.innerHTML = "";

        q.options.forEach((optionText, index) => {
            const btn = document.createElement("button");
            // Класс .auth-btn из stylr.txt обеспечивает неоновый стиль и анимацию
            btn.className = "auth-btn";
            btn.style.width = "100%";
            btn.style.textAlign = "left";
            btn.style.justifyContent = "flex-start";
            btn.style.padding = "14px 18px";
            btn.style.fontSize = "12px";
            btn.textContent = `${index + 1}. ${optionText}`;
            
            btn.onclick = () => handleAnswer(index);
            answersList.appendChild(btn);
        });
    }

    function handleAnswer(selectedIndex) {
        if (selectedIndex === questions[currentQuestionIndex].correct) {
            score++;
        }

        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizContainer.style.display = "none";
        resultContainer.style.display = "block";
        scoreText.innerHTML = `Правильных ответов: <b style="color: var(--mint);">${score}</b> из <b>${questions.length}</b>`;
    }

    function restartQuiz() {
        score = 0;
        currentQuestionIndex = 0;
        resultContainer.style.display = "none";
        quizContainer.style.display = "block";
        loadQuestion();
    }

    // Старт тестирования при загрузке
    document.addEventListener("DOMContentLoaded", initQuiz);
</script>
{% endblock %}
