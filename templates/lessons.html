<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Уроки | Void Learn</title>
</head>
<body>
    <!-- КНОПКА МЕНЮ ВЕРНУЛАСЬ -->
    <div class="burger-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

    <!-- Заголовок -->
    <div style="display: flex; justify-content: center; margin-top: 30px;">
        <div class="badge-top">ВИДЕО КУРСЫ</div>
    </div>

    <!-- Меню -->
    <div id="sidePane" class="side-panel">
        <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
        <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
        <a href="/lessons" class="nav-link active-page">УРОКИ</a>
        <a href="/rating" class="nav-link">РЕЙТИНГ</a>
    </div>

    <!-- Контент -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; margin-top: 50px; padding-bottom: 50px;">
        <div class="auth-card" style="max-width: 400px;">
            <h3 style="color: var(--mint);">ОСНОВЫ PYTHON</h3>
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/твой_id_видео" frameborder="0" allowfullscreen style="border-radius: 15px;"></iframe>
            <p style="font-size: 14px; margin-top: 10px;">С нуля до уровня junior. Урок №1: Основы синтаксиса и переменные.</p>
        </div>

        <div class="auth-card" style="max-width: 400px;">
            <h3 style="color: var(--mint);">ОБЪЕКТЫ И КЛАССЫ</h3>
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/другой_id" frameborder="0" allowfullscreen style="border-radius: 15px;"></iframe>
            <p style="font-size: 14px; margin-top: 10px;">С нуля до уровня junior. Урок №2: Объекты и классы.</p>
        </div>
    </div>

    <script>function toggleMenu() { document.getElementById('sidePane').classList.toggle('active'); }</script>
</body>
</html>
