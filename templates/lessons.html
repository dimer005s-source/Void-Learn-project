<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ range(1, 9999) | random }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>УРОКИ - Void Learn</title>
    <style>
        .hidden { display: none; }
        .lessons-container { width: 95%; max-width: 800px; margin-top: 50px; }
        
        /* Стили для плашек языков */
        .lang-card {
            background: var(--mint);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
            font-size: 20px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .lang-card:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Стили для карточек уроков внутри */
        .lesson-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            cursor: pointer;
            border-left: 5px solid var(--mint);
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .video-container {
            margin-top: 15px;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="burger-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <div id="sidePane" class="side-panel">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <div class="theme-switcher-corner">
            <button onclick="setTheme('light')"><i class="fas fa-sun"></i></button>
            <button onclick="setTheme('dark')"><i class="fas fa-moon"></i></button>
            <button onclick="setTheme('purple')"><i class="fas fa-ghost"></i></button>
        </div>
        <div class="menu-header">
            <div class="badge-top">VOID LEARN</div>
        </div>
        <div class="nav-links-wrapper">
            <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
            <a href="/portfolios" class="nav-link">ГАЛЕРЕЯ</a>
            <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
            <a href="/lessons" class="nav-link active-page">УРОКИ</a>
            <a href="/rating" class="nav-link">РЕЙТИНГ</a>
        </div>
        <a href="/logout" class="exit-link">ВЫХОД</a>
    </div>

    <div class="auth-wrapper">
        <div class="badge-top">УЧЕБНЫЕ МОДУЛИ</div>

        <div class="lessons-container">
            {% for lang, lessons_list in modules.items() %}
                {% if lessons_list %}
                <!-- 1 УРОВЕНЬ: ЯЗЫК -->
                <div class="lang-group">
                    <div class="lang-card" onclick="toggleBlock('content_{{ lang }}')">
                        {{ lang }} <i class="fas fa-chevron-down" style="font-size: 14px; margin-left: 10px;"></i>
                    </div>
                    
                    <!-- 2 УРОВЕНЬ: СПИСОК УРОКОВ (СКРЫТ) -->
                    <div id="content_{{ lang }}" class="hidden" style="padding: 0 10px 20px;">
                        {% for lesson in lessons_list %}
                        <div class="lesson-card">
                            <div onclick="toggleBlock('video_{{ lang }}_{{ loop.index }}')" style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="color: var(--text-main); font-weight: bold;">{{ lesson.title }}</span>
                                <i class="fas fa-video" style="color: var(--mint);"></i>
                            </div>

                            <!-- 3 УРОВЕНЬ: ВИДЕО (СКРЫТО) -->
                            <div id="video_{{ lang }}_{{ loop.index }}" class="hidden">
                                <div class="video-container">
                                    <iframe src="https://www.youtube.com/embed/{{ lesson.id }}" allowfullscreen></iframe>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <script>
        // Универсальная открывашка
        function toggleBlock(id) {
            const block = document.getElementById(id);
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
            } else {
                block.classList.add('hidden');
            }
        }

        function toggleMenu() {
            const pane = document.getElementById('sidePane');
            const burger = document.querySelector('.burger-btn');
            pane.classList.toggle('active');
            if (pane.classList.contains('active')) {
                burger.style.opacity = '0';
                burger.style.pointerEvents = 'none';
            } else {
                burger.style.opacity = '1';
                burger.style.pointerEvents = 'all';
            }
        }

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
    </script>
</body>
</html>
