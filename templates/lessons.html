{% extends "base.html" %}

{% block title %}КУРСЫ - VOID LEARN{% endblock %}

{% block content %}
<div style="width: 95%; max-width: 1000px; padding: 100px 0;">
    <h1 style="color: var(--mint); text-align: center; letter-spacing: 5px; margin-bottom: 50px; text-shadow: var(--neon-state);">ЦЕНТР ОБУЧЕНИЯ VOID</h1>

    {% for category, items in modules.items() %}
    <!-- УРОВЕНЬ 1: ВЫБОР ЯЗЫКА -->
    <div style="margin-bottom: 20px;">
        <button class="auth-btn" onclick="toggleSection('cat-{{ loop.index }}')" style="width: 100%; text-align: left; font-size: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fas fa-code" style="margin-right: 15px;"></i> {{ category | upper }}</span>
            <i class="fas fa-chevron-down"></i>
        </button>

        <div id="cat-{{ loop.index }}" class="hidden" style="padding: 10px; background: rgba(var(--mint-rgb), 0.02); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 15px 15px;">
            
            <!-- УРОВЕНЬ 2: СПИСОК УРОКОВ -->
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                {% for lesson in items %}
                <div style="border: 1px solid rgba(var(--mint-rgb), 0.2); border-radius: 10px;">
                    <button class="auth-btn" onclick="toggleSection('lesson-{{ category }}-{{ loop.index }}')" style="width: 100%; text-align: left; font-size: 14px; border: none !important; border-radius: 10px; background: transparent; display: flex; justify-content: space-between;">
                        <span>{{ lesson.title }}</span>
                        <span style="opacity: 0.5;">Смотреть <i class="fas fa-play"></i></span>
                    </button>

                    <!-- САМО ВИДЕО (скрыто внутри урока) -->
                    <div id="lesson-{{ category }}-{{ loop.index }}" class="hidden" style="padding: 15px;">
                        <div style="position: relative; padding-bottom: 56.25%; height: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--mint);">
                            <iframe 
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                                src="{{ lesson.video_url }}" 
                                frameborder="0" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div style="margin-top: 15px; text-align: right;">
                            <a href="/test_hub" class="auth-btn" style="padding: 5px 15px; font-size: 10px; text-decoration: none;">ПРОЙТИ ТЕСТ ПО ТЕМЕ</a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

        </div>
    </div>
    {% endfor %}
</div>

<script>
    function toggleSection(id) {
        const el = document.getElementById(id);
        // Закрываем другие уроки в той же категории для красоты (опционально)
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
        } else {
            el.classList.add('hidden');
        }
    }
</script>

<style>
    /* Плавный переход для ховера на кнопки модулей */
    .auth-btn:hover {
        background: rgba(var(--mint-rgb), 0.1) !important;
    }
    
    /* Убираем лишние бордеры внутри вложенных списков */
    .auth-btn i {
        transition: transform 0.3s;
    }
</style>
{% endblock %}
