<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
    <title>УРОКИ - Void Learn</title>
    <style>
        .module-section {
            width: 95%; max-width: 1100px; margin: 20px auto;
            background: white; border-radius: 20px; padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; margin-top: 15px; padding-bottom: 20px;
        }
        .video-card { background: var(--milk); padding: 10px; border-radius: 12px; text-align: center; }
        .video-card iframe { width: 100%; border-radius: 8px; aspect-ratio: 16 / 9; }
        .video-title { font-size: 11px; margin-top: 10px; color: var(--mint); font-family: 'BlackAcute'; }
        
        summary {
            list-style: none; cursor: pointer; font-size: 20px; padding: 15px 10px;
            color: var(--mint); display: flex; justify-content: space-between; align-items: center;
            font-family: 'BlackAcute';
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { opacity: 0.8; }
    </style>
</head>
<body>
<div id="sidePane" class="side-panel">
    <!-- Крестик -->
    <div class="close-btn" onclick="toggleMenu()">&times;</div>

    <!-- ВСЕ ССЫЛКИ КЛАДЁМ В ЭТУ ОБЁРТКУ -->
    <div class="nav-links-wrapper">
        <a href="/profile" class="nav-link">ПРОФИЛЬ</a>
        <a href="/portfolios" class="nav-link">ГАЛЕРЕЯ</a>
        <a href="/test_hub" class="nav-link">ТЕСТЫ</a>
        <a href="/lessons" class="nav-link">УРОКИ</a>
        <a href="/rating" class="nav-link">РЕЙТИНГ</a>
    </div>

    <!-- КНОПКЕ ВЫХОД ДАЁМ КЛАСС exit-link (БЕЗ style="...") -->
    <a href="/logout" class="exit-link">ВЫХОД</a>
</div>


    <div class="burger-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

    <div class="auth-wrapper" style="justify-content: flex-start; padding-top: 40px;">
        <div class="badge-top">УЧЕБНЫЕ МОДУЛИ</div>

        <div style="width: 100%; margin-top: 40px;">
            {% for module_name, videos in modules.items() %}
            <div class="module-section">
                <!-- ТУТ ТЕПЕРЬ ПРОСТО DETAILS (ВСЁ ЗАКРЫТО) -->
                <details>
                    <summary>{{ module_name }} <span style="font-size: 14px;">▼</span></summary>
                    <div class="video-grid">
                        {% for video in videos %}
                        <div class="video-card">
                            <iframe src="https://www.youtube.com/embed/{{ video.id }}" frameborder="0" allowfullscreen></iframe>
                            <div class="video-title">{{ video.title }}</div>
                        </div>
                        {% endfor %}
                    </div>
                </details>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleMenu() {
            let pane = document.getElementById('sidePane');
            let burger = document.querySelector('.burger-btn');
            pane.classList.toggle('active');
            if (pane.classList.contains('active')) {
                burger.style.display = 'none';
            } else {
                burger.style.display = 'block';
            }
        }
    </script>
</body>
</html>
